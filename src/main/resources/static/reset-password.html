<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Reset password — QuickCart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html" class="brand">Quick<span>Cart</span></a>
  <nav><ul>
    <li><a href="stores.html">Stores</a></li>
    <li><a href="help.html">Help</a></li>
    <li><a href="login.html">Log in</a></li>
  </ul></nav>
</header>

<main class="auth-wrap">
  <section class="auth-card">
    <h2>Choose a new password</h2>
    <p class="sub">Your reset link is valid for 30 minutes and can only be used once.</p>
    <p class="auth-error" id="errorMsg" role="alert"></p>
    <p class="auth-success" id="successMsg" role="status"></p>
    <form id="resetPasswordForm">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" minlength="6" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" minlength="6" autocomplete="new-password" required>
      </div>
      <button type="submit" class="auth-btn">Reset password</button>
    </form>
    <p class="auth-switch"><a href="login.html">Back to log in</a></p>
  </section>
</main>

<script src="common.js"></script>
<script>
const resetToken = new URLSearchParams(window.location.search).get('token');
const form = document.getElementById('resetPasswordForm');
const errorMessage = document.getElementById('errorMsg');
const successMessage = document.getElementById('successMsg');

if (!resetToken) {
  form.hidden = true;
  errorMessage.textContent = 'This password reset link is invalid or has expired. Request a new one to continue.';
  errorMessage.classList.add('show');
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  errorMessage.classList.remove('show');
  successMessage.classList.remove('show');

  if (password !== confirmPassword) {
    errorMessage.textContent = 'The passwords do not match.';
    errorMessage.classList.add('show');
    return;
  }

  try {
    const result = await api('/api/reset-password', {
      method: 'POST',
      body: JSON.stringify({ token: resetToken, password })
    });
    form.hidden = true;
    successMessage.textContent = result.message;
    successMessage.classList.add('show');
  } catch (error) {
    errorMessage.textContent = error.message;
    errorMessage.classList.add('show');
  }
});
</script>
</body>
</html>
