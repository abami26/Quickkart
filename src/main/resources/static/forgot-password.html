<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — QuickCart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html" class="brand">Quick<span>Cart</span></a>
  <nav><ul>
    <li><a href="stores.html">Stores</a></li>
    <li><a href="help.html">Help</a></li>
    <li><a href="signup.html">Sign up</a></li>
  </ul></nav>
</header>

<main class="auth-wrap">
  <section class="auth-card">
    <h2>Forgot your password?</h2>
    <p class="sub">Enter the email address linked to your account and we’ll send you a reset link.</p>
    <p class="auth-error" id="errorMsg" role="alert"></p>
    <p class="auth-success" id="successMsg" role="status"></p>
    <form id="forgotPasswordForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <button type="submit" class="auth-btn">Send reset link</button>
    </form>
    <p class="auth-switch"><a href="login.html">Back to log in</a></p>
  </section>
</main>

<script src="common.js"></script>
<script>
document.getElementById('forgotPasswordForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();
  const errorMessage = document.getElementById('errorMsg');
  const successMessage = document.getElementById('successMsg');
  errorMessage.classList.remove('show');
  successMessage.classList.remove('show');

  try {
    const result = await api('/api/forgot-password', {
      method: 'POST',
      body: JSON.stringify({ email })
    });
    successMessage.textContent = result.message;
    successMessage.classList.add('show');
  } catch (error) {
    errorMessage.textContent = error.message;
    errorMessage.classList.add('show');
  }
});
</script>
</body>
</html>
