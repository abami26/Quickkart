<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — QuickCart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html" class="brand">Quick<span>Cart</span></a>
  <nav><ul>
    <li><a href="stores.html">Stores</a></li>
    <li><a href="help.html">Help</a></li>
    <li><a href="signup.html">Sign up</a></li>
  </ul></nav>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to place an order and track it.</p>
    <p class="auth-error" id="errorMsg"></p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="auth-btn">Log in</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script src="common.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('errorMsg');
  errBox.classList.remove('show');

  try {
    const data = await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    setSession(data.token, data.user);
    window.location.href = 'index.html';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.add('show');
  }
});
</script>
</body>
</html>
