spring.application.name=quickcart
server.port=8080

# Required for Spring Boot to auto-configure JavaMailSender; override for your SMTP provider.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# H2 file-based database — creates a "data" folder next to the jar with the actual db file
spring.datasource.url=jdbc:h2:file:./data/quickcart;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create/update tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Payment receipt uploads (bank transfer): max 5MB per file, saved to this folder
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
quickcart.receipts.dir=./data/receipts

# Lets you browse the database in a web UI at http://localhost:8080/h2-console
# JDBC URL to paste in there: jdbc:h2:file:./data/quickcart
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
